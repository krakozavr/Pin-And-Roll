name: release

# Builds, tests and publishes pr.exe as a release. Start it either by pushing
# a tag such as v1.0.0, or by hand (Actions > release > Run workflow) with the
# version to publish; the tag is then created on the commit that was built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v1.0.0'
        required: true
      replace:
        description: 'Replace an existing release of this version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Integration test
        timeout-minutes: 5
        run: build\Release\prtest.exe build\Release\pr.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version || github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { Write-Error "not a version tag: $tag"; exit 1 }
          $hash = (Get-FileHash build\Release\pr.exe -Algorithm SHA256).Hash.ToLower()
          if ("${{ inputs.replace }}" -eq "true") {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { gh release delete $tag --cleanup-tag --yes }
            $global:LASTEXITCODE = 0
          }
          $notes = @"
          Pin&Roll $tag for Windows 10 and 11 (64-bit; also runs on ARM64 Windows).

          Download ``pr.exe`` below and run it. There is no installer.

          The program is not signed, so your browser and Windows may warn about it;
          see the README for what to expect and how to build it yourself.

          SHA-256 of pr.exe: ``$hash``
          "@
          $notes | Out-File -Encoding utf8 notes.md
          gh release create $tag build\Release\pr.exe --title "Pin&Roll $tag" --notes-file notes.md --target "${{ github.sha }}"
