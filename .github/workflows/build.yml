name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Integration test (real windows, real clicks on the buttons)
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          cmd /c ver
          build\Release\prtest.exe build\Release\pr.exe --shot shots\${{ matrix.os }}
      - name: Start-up entry (scheduled task when "run as administrator" is set)
        if: always()
        run: |
          Set-Content -Path at.ini -Value "[Settings]`r`nRunAsAdmin=1"
          Start-Process -Wait build\Release\pr.exe -ArgumentList '--config', "$PWD\at.ini", '--autostart', 'on'
          schtasks /query /tn "FBX Pin and Roll-up" /xml
          if ($LASTEXITCODE -ne 0) { Write-Error "task was not created"; exit 1 }
          Start-Process -Wait build\Release\pr.exe -ArgumentList '--config', "$PWD\at.ini", '--autostart', 'off'
          schtasks /query /tn "FBX Pin and Roll-up" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "task was not removed"; exit 1 }
          exit 0
      - name: Upload program
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinroll-${{ matrix.os }}
          path: |
            build/Release/pr.exe
            shots/*.png
